<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<title>주차관리과 오시는 길 | 남양주시 교통국</title>
<meta name="description" content="남양주시 교통국 주차관리과는 제2청사(보건소)가 아니라 길 건너 교통국 청사에 있습니다. 걸어서·차로 오시는 길을 단계별로 안내합니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="주차관리과 오시는 길 | 남양주시 교통국">
<meta property="og:description" content="제2청사(보건소)가 아닙니다. 길 건너 교통국 청사로 오세요. 그림과 음성으로 단계별 안내.">
<!-- 깃허브에 올린 뒤 대표 그림 주소를 넣으면 카톡·문자 미리보기에 그림이 뜸 -->
<!-- <meta property="og:image" content="https://dpsdkfwl11.github.io/SMS/preview.png"> -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-gov-dynamic-subset.min.css">
<style>
  /* 남양주시 CI 색: 파랑 #1D3A8F · 초록 #23A638 / 규격은 대한민국 정부 디자인 시스템(KRDS) 기준 */
  :root {
    --blue: #1D3A8F; --blue-700: #152C6E; --blue-50: #EEF2FB; --blue-100: #D9E2F5;
    --green: #23A638; --green-ink: #17772A; --green-50: #EAF6EC;
    --ink: #111827; --sub: #4B5563; --mute: #6B7280; --line: #D9DEE6; --surface: #F4F6F9; --white: #FFFFFF;
    --r: 12px;
    font-size: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--white); color: var(--ink);
    font-family: "Pretendard GOV Variable", "Pretendard GOV", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.55; word-break: keep-all; overflow-wrap: anywhere; letter-spacing: -0.01em;
    padding-bottom: calc(4.6rem + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg.i { width: 1.2em; height: 1.2em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  /* 상단줄 — CI + 부서 + 글씨 크기 */
  .bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .bar .ci { height: 26px; width: auto; display: block; }
  .bar .dept { font-size: .75rem; font-weight: 600; color: var(--sub); padding-left: 10px; border-left: 1px solid var(--line); line-height: 1.2; }
  .fs { margin-left: auto; display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .fs button { width: 2.4rem; height: 2.4rem; border: 0; background: var(--white); font-weight: 700; }
  .fs button + button { border-left: 1px solid var(--line); }
  .fs button:first-child { font-size: .75rem; }
  .fs button:last-child { font-size: 1.05rem; }
  .fs button:disabled { color: #C0C6D0; cursor: default; }

  /* 제목 */
  .intro { padding: 20px 16px 14px; }
  .intro h1 { margin: 0; font-size: 1.6rem; font-weight: 800; line-height: 1.3; letter-spacing: -0.03em; }
  .intro .lead { margin: .5rem 0 0; font-size: 1.05rem; color: var(--sub); font-weight: 500; }
  .intro .lead b { color: var(--ink); font-weight: 700; }
  .intro .lead .hl { color: var(--blue); }

  /* 걸어서 / 차로 */
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin: 16px 0 0; padding: 4px; background: var(--surface); border-radius: var(--r); }
  .seg button { display: flex; align-items: center; justify-content: center; gap: .45rem; min-height: 3.1rem; padding: .35rem .5rem; border: 0; border-radius: 9px; background: transparent; color: var(--sub); font-size: 1rem; font-weight: 700; line-height: 1.2; text-align: left; }
  .seg button small { display: block; font-size: .7rem; font-weight: 500; color: inherit; opacity: .85; }
  .seg button[aria-selected="true"] { background: var(--white); color: var(--blue); box-shadow: 0 1px 2px rgba(17, 24, 39, .08), 0 0 0 1px var(--line); }
  .seg button[data-mode="car"][aria-selected="true"] { color: var(--green-ink); }

  /* 지도 */
  .mapwrap { position: relative; height: clamp(320px, 56vh, 560px); background: #EEF1F4; overflow: hidden; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); touch-action: pan-y; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .ov { position: absolute; inset: 0; pointer-events: none; }
  .ov > * { position: absolute; left: 0; top: 0; will-change: transform; }
  .north { position: absolute; right: 10px; top: 10px; width: 2.2rem; height: 2.2rem; border-radius: 50%; background: var(--white); border: 1px solid var(--line); display: grid; place-items: center; font-size: .6rem; font-weight: 800; color: var(--sub); line-height: 1; }
  .north svg { width: .8rem; height: .8rem; margin-bottom: -2px; }
  /* 지도 위에서 넘기기 — 양옆 ‹ › 버튼, 지금 단계 표시, 밀어서 넘기기 안내 */
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 1px solid var(--line); background: rgba(255, 255, 255, .95); color: var(--ink); display: grid; place-items: center; box-shadow: 0 1px 4px rgba(17, 24, 39, .15); z-index: 2; }
  .nav svg.i { width: 1.1rem; height: 1.1rem; stroke-width: 2.6; }
  .nav.l { left: 8px; } .nav.r { right: 8px; }
  .nav[hidden] { display: none; }
  .nav:active { background: var(--blue-50); }
  .chip { position: absolute; left: 10px; top: 10px; max-width: calc(100% - 4.6rem); display: flex; align-items: center; gap: .4rem; padding: .3rem .65rem .3rem .35rem; border-radius: 999px; background: rgba(255, 255, 255, .96); border: 1px solid var(--line); font-size: .72rem; font-weight: 700; box-shadow: 0 1px 3px rgba(17, 24, 39, .1); z-index: 2; pointer-events: none; }
  .chip b { flex: none; min-width: 2.4rem; text-align: center; padding: .08rem .4rem; border-radius: 999px; background: var(--blue); color: #fff; font-size: .62rem; font-weight: 800; }
  .car-mode .chip b { background: var(--green-ink); }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .swipe-hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); padding: .35rem .8rem; border-radius: 999px; background: rgba(17, 24, 39, .78); color: #fff; font-size: .68rem; font-weight: 600; white-space: nowrap; z-index: 2; pointer-events: none; transition: opacity .5s; }
  .swipe-hint.hide { opacity: 0; }

  /* 지도 위 이름표·표시 (화면에서 늘 같은 크기) */
  .lb { transform: translate(-50%, -50%); white-space: nowrap; padding: .22rem .5rem; border-radius: 6px; font-size: .72rem; font-weight: 700; line-height: 1.3; background: var(--white); color: var(--ink); border: 1px solid #C9D0DA; }
  .lb.muted { font-size: .64rem; font-weight: 600; color: var(--sub); background: rgba(255, 255, 255, .92); border-color: #D5DBE3; }
  .lb.blue { background: var(--blue); color: #fff; border-color: var(--blue); }
  .lb.green { background: var(--green-ink); color: #fff; border-color: var(--green-ink); }
  .lb.sky { background: #E3F3FC; color: #0F4C6E; border-color: #9CCFEA; }
  .lb.no { background: #374151; color: #fff; border-color: #374151; }
  .lb.no::before { content: "✕ "; font-weight: 800; }
  .mk { transform: translate(-50%, -50%); display: grid; place-items: center; border-radius: 50%; font-weight: 800; color: #fff; }
  .mk.me { width: 1.7rem; height: 1.7rem; background: var(--blue); border: 3px solid #fff; font-size: .62rem; box-shadow: 0 0 0 6px rgba(29, 58, 143, .18); }
  .mk.me.car { background: var(--green-ink); box-shadow: 0 0 0 6px rgba(35, 166, 56, .2); }
  .mk.gate { width: 1.4rem; height: 1.4rem; background: var(--green-ink); border: 2px solid #fff; }
  .mk.gate svg, .mk.stair svg { width: .8rem; height: .8rem; stroke: #fff; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .mk.stair { width: 1.5rem; height: 1.5rem; border-radius: 6px; background: var(--green-ink); border: 2px solid #fff; }
  .mk.park { width: 1.25rem; height: 1.25rem; border-radius: 5px; background: #4B5563; border: 2px solid #fff; font-size: .62rem; }
  .mk.door { width: 1.15rem; height: 1.35rem; border-radius: 4px; background: #5C93B3; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
  .mk.door svg { width: 70%; height: 80%; }
  .mk.door.main { width: 1.55rem; height: 1.85rem; background: var(--blue); box-shadow: 0 0 0 5px rgba(29, 58, 143, .2), 0 1px 3px rgba(0, 0, 0, .25); }
  .dot { width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff; border: 4px solid var(--blue); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
  .dot.car { border-color: var(--green-ink); }
  .pin { transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; }
  .pin .name { white-space: nowrap; padding: .28rem .6rem; border-radius: 8px; background: var(--ink); color: #fff; font-size: .78rem; font-weight: 800; margin-bottom: 4px; box-shadow: 0 2px 6px rgba(0, 0, 0, .18); }
  .pin svg { width: 30px; height: 38px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .25)); }

  /* 단계 안내 */
  .panel { padding: 16px 16px 8px; }
  .prog { display: flex; gap: 4px; }
  .prog i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); transition: background .3s; }
  .prog i.on { background: var(--blue); }
  .car-mode .prog i.on { background: var(--green); }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: .78rem; font-weight: 600; color: var(--mute); }
  .meta b { color: var(--blue); font-weight: 800; }
  .car-mode .meta b { color: var(--green-ink); }
  .panel h2 { margin: .4rem 0 .35rem; font-size: 1.35rem; font-weight: 800; line-height: 1.35; letter-spacing: -0.02em; }
  .panel .text { margin: 0; font-size: 1.05rem; color: #1F2937; min-height: 3.2em; }
  .panel .text b { color: var(--blue); font-weight: 700; }
  .car-mode .panel .text b { color: var(--green-ink); }
  .ctrl { display: grid; grid-template-columns: 1fr auto 1.4fr; gap: 8px; margin-top: 16px; }
  .ctrl button { display: flex; align-items: center; justify-content: center; gap: .35rem; min-height: 3.2rem; padding: 0 .9rem; border-radius: 10px; font-size: 1rem; font-weight: 700; border: 1px solid var(--line); background: var(--white); color: var(--ink); }
  .ctrl button:disabled { color: #B6BDC8; background: var(--surface); cursor: default; }
  .ctrl .play { color: var(--blue); border-color: var(--blue-100); background: var(--blue-50); min-width: 3.4rem; }
  .ctrl .play.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  .ctrl .next { background: var(--blue); border-color: var(--blue); color: #fff; }
  .ctrl .next:active { background: var(--blue-700); }
  .car-mode .ctrl .next { background: var(--green-ink); border-color: var(--green-ink); }
  .car-mode .ctrl .play { color: var(--green-ink); border-color: #C8E6CE; background: var(--green-50); }
  .car-mode .ctrl .play.on { background: var(--green-ink); color: #fff; }

  details.all { margin-top: 18px; border-top: 1px solid var(--line); }
  details.all summary { list-style: none; display: flex; align-items: center; justify-content: space-between; min-height: 3rem; font-size: .9rem; font-weight: 700; color: var(--sub); cursor: pointer; }
  details.all summary::-webkit-details-marker { display: none; }
  details.all summary::after { content: ""; width: .5rem; height: .5rem; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); margin-right: 4px; transition: transform .2s; }
  details.all[open] summary::after { transform: rotate(-135deg); }
  .all ol { list-style: none; margin: 0 0 8px; padding: 0; }
  .all li button { display: grid; grid-template-columns: 1.7rem 1fr; gap: .6rem; width: 100%; text-align: left; padding: .7rem 0; border: 0; border-top: 1px solid var(--surface); background: none; }
  .all li .n { width: 1.7rem; height: 1.7rem; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--sub); font-size: .7rem; font-weight: 800; }
  .all li.cur .n { background: var(--blue); color: #fff; }
  .car-mode .all li.cur .n { background: var(--green-ink); }
  .all li strong { display: block; font-size: .95rem; font-weight: 700; }
  .all li span.t { display: block; font-size: .85rem; color: var(--sub); }

  .info { margin: 8px 16px 0; padding: 14px 16px; border-radius: var(--r); background: var(--surface); font-size: .85rem; color: var(--sub); }
  .info b { color: var(--ink); }
  .info a { color: var(--blue); font-weight: 700; text-decoration: none; }
  footer { padding: 16px; font-size: .7rem; color: var(--mute); display: flex; align-items: center; gap: 8px; }
  footer img { height: 16px; opacity: .8; }

  /* 아래 고정 버튼 */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: rgba(255, 255, 255, .97); border-top: 1px solid var(--line); }
  .dock a { display: flex; align-items: center; justify-content: center; gap: .45rem; min-height: 3.2rem; border-radius: 10px; font-size: 1rem; font-weight: 700; text-decoration: none; }
  .dock .call { background: var(--blue); color: #fff; }
  .dock .way { background: var(--white); color: var(--ink); border: 1px solid var(--line); }
  .dock .way .nv { width: 1.1rem; height: 1.1rem; border-radius: 4px; background: #03C75A; color: #fff; display: grid; place-items: center; font-size: .62rem; font-weight: 900; }
  @media (min-width: 680px) { .dock { left: 50%; right: auto; width: 640px; transform: translateX(-50%); border: 1px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0; } }

  .toast { position: fixed; left: 50%; bottom: calc(5rem + env(safe-area-inset-bottom)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); background: var(--ink); color: #fff; padding: .6rem 1rem; border-radius: 10px; font-size: .9rem; font-weight: 600; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

        labels: [[524, 466, '공원조성과', 'muted'], [656, 566, '교통약자이동지원센터', 'muted'], [500, 556, '계단', 'green']],
        text: '공원조성과와 교통약자이동지원센터 사이 <b>계단</b>으로 올라와, <b>왼쪽으로 조금</b> 가면 주차관리과 입구입니다.' }
    ]
  }
};

// ═════════ 지도 그리기 ═════════
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const P = pts => pts.map(p => p.join(',')).join(' ');
const COLORS = {
  etc:  { roof: '#FFFFFF', wall: '#CDD3DC' },
  two:  { roof: '#E7EAF0', wall: '#97A1B0' },
  two2: { roof: '#F7F8FA', wall: '#C3C9D3' },
  tk:   { roof: '#D6EEFA', wall: '#6FB4DA' },     // 안내판의 교통국 하늘색
  dest: { roof: '#4F69B5', wall: '#1D3A8F' }      // 목적지 — CI 파랑
};
const shade = (hex, k) => {
  const n = parseInt(hex.slice(1), 16), f = c => Math.max(0, Math.min(255, Math.round(c * k)));
  return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`;
};
const svg = document.getElementById('map'), ov = document.getElementById('ov'), wrapEl = document.getElementById('mapwrap');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function drawWorld() {
  const g = el('g', {}, svg);
  const defs = el('defs', {}, svg);
  defs.innerHTML = '<pattern id="lot" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)"><rect width="11" height="11" fill="#E4E8ED"/><path d="M0 0V11" stroke="#D6DBE2" stroke-width="1.2"/></pattern>';
  el('rect', { x: -900, y: -1500, width: 2600, height: 2800, fill: '#EEF1F4' }, g);
  el('path', { d: 'M790 -1100 C800 200 830 420 920 800 L1700 800 L1700 -1100 Z', fill: '#E1EEDD' }, g);
  for (const r of ROADS) {
    el('polyline', { points: P(r.pts), stroke: '#DCE1E8', 'stroke-width': r.w + 5, fill: 'none', 'stroke-linejoin': 'round' }, g);
    el('polyline', { points: P(r.pts), stroke: '#FFFFFF', 'stroke-width': r.w, fill: 'none', 'stroke-linejoin': 'round' }, g);
  }
  // 36번길 횡단보도
  for (let i = -3; i <= 3; i++) {
    const cx = CROSS[0] + i * 4.5 * 0.98, cy = CROSS[1] - i * 4.5 * 0.2;
    el('line', { x1: cx - 15 * 0.2, y1: cy - 15 * 0.98, x2: cx + 15 * 0.2, y2: cy + 15 * 0.98, stroke: '#C5CCD6', 'stroke-width': 2.6 }, g);
  }
  for (const site of [SITE2, SITE]) el('polygon', { points: P(site), fill: '#F8F9FB', stroke: '#E1E5EB', 'stroke-width': 6, 'stroke-linejoin': 'round' }, g);
  for (const lot of LOTS) el('polygon', { points: P(lot), fill: 'url(#lot)', stroke: '#E9ECF0', 'stroke-width': 6, 'stroke-linejoin': 'round' }, g);
  // 건물 — 남쪽 것을 나중에 그려 앞에 보이게. 지붕 한 면 + 보이는 벽, 빛은 한 방향
  const order = BLDS.slice().sort((a, b) => Math.max(...a.pts.map(p => p[1])) - Math.max(...b.pts.map(p => p[1])));
  for (const b of order) {
    const c = COLORS[b.kind], ox = b.h * 0.4, oy = -b.h * 0.95;
    el('polygon', { points: P(b.pts.map(([x, y]) => [x + b.h * 0.55, y + b.h * 0.25])), fill: 'rgba(30, 41, 59, .08)' }, g);
    const walls = b.pts.map((p, i) => [p, b.pts[(i + 1) % b.pts.length]]).sort((a, d) => (a[0][1] + a[1][1]) - (d[0][1] + d[1][1]));
    for (const [a, d] of walls) {
      const nx = d[1] - a[1], ny = -(d[0] - a[0]), L = Math.hypot(nx, ny);
      const sh = 0.84 + 0.16 * ((nx * -0.35 + ny * 0.94) / L);
      el('polygon', { points: P([a, d, [d[0] + ox, d[1] + oy], [a[0] + ox, a[1] + oy]]), fill: shade(c.wall, sh) }, g);
    }
    el('polygon', { points: P(b.pts.map(([x, y]) => [x + ox, y + oy])), fill: c.roof, stroke: shade(c.wall, 0.88), 'stroke-width': .8, 'vector-effect': 'non-scaling-stroke' }, g);
  }
  return el('g', {}, svg);   // 경로가 들어갈 층(건물 위)
}
const routeLayer = drawWorld();

// ═════════ 지도 위 표시(HTML) — 확대해도 화면에서 같은 크기 ═════════
let vb = [...OVERVIEW_BOX], items = [], dot = null, dotSeg = null;
function fitBox([x, y, w, h]) {
  const W = wrapEl.clientWidth, H = wrapEl.clientHeight, r = W / H;
  if (w / h > r) { const nh = w / r; y -= (nh - h) / 2; h = nh; } else { const nw = h * r; x -= (nw - w) / 2; w = nw; }
  return [x, y, w, h];
}
function place() {
  const W = wrapEl.clientWidth, H = wrapEl.clientHeight;
  svg.setAttribute('viewBox', vb.join(' '));
  for (const it of items) {
    const sx = (it.x - vb[0]) / vb[2] * W, sy = (it.y - vb[1]) / vb[3] * H;
    it.el.style.left = sx + 'px'; it.el.style.top = sy + 'px';
  }
}
function addItem(x, y, html, cls) {
  const d = document.createElement('div');
  d.className = cls; d.innerHTML = html; ov.appendChild(d);
  items.push({ x, y, el: d }); return d;
}
const ARROW = '<svg viewBox="0 0 12 12"><path d="M6 10V2M2.5 5.5L6 2l3.5 3.5"/></svg>';
const STAIRS = '<svg viewBox="0 0 12 12"><path d="M1.5 10.5h3v-3h3v-3h3"/></svg>';
// 출입문 — 문틀 + 반쯤 열린 문 + 손잡이
const DOORSVG = '<svg viewBox="0 0 12 14"><path d="M2 13V1.5h8V13" fill="none" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/><path d="M2 13V1.5l5.5 1.2V13.8z" fill="#fff"/><circle cx="6" cy="7.6" r=".8" fill="#1D3A8F"/></svg>';
const PINSVG = c => `<svg viewBox="0 0 30 38"><path d="M15 37C15 37 2 23.5 2 14.5a13 13 0 0 1 26 0C28 23.5 15 37 15 37z" fill="${c}" stroke="#fff" stroke-width="2.5"/><circle cx="15" cy="14.5" r="5" fill="#fff"/></svg>`;

// ═════════ 상태·화면 갱신 ═════════
let mode = 'walk', idx = 0, anim = 0;
const $ = id => document.getElementById(id);
const steps = () => MODES[mode].steps;

function drawRoutes(s) {
  routeLayer.innerHTML = '';
  const add = (pts, color, w, op, dash) => el('polyline', { points: P(pts), fill: 'none', stroke: color, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: op, 'stroke-dasharray': dash || 'none', 'vector-effect': 'non-scaling-stroke' }, routeLayer);
  const other = mode === 'walk' ? 'car' : 'walk', p = PATHS[mode];
  if (!s.seg) {   // 한눈에 보기 — 고른 길은 진하게, 다른 길은 옅은 점선
    add(PATHS[other].pts, '#9CA3AF', 3, .7, '2 6');
    add(p.pts, '#fff', 11, 1); add(p.pts, p.color, 6, 1);
    return p.pts;
  }
  const [a, b] = s.seg;
  add(p.pts, '#fff', 10, 1); add(p.pts, '#AEB7C6', 4, 1);               // 남은 길
  if (a > 0) add(p.pts.slice(0, a + 1), p.color, 5, .45);               // 지나온 길
  const cur = p.pts.slice(a, b + 1);
  add(cur, '#fff', 12, 1); add(cur, p.color, 7, 1);                     // 지금 구간
  return cur;
}
function buildOverlay(s) {
  ov.innerHTML = ''; items = [];
  const marks = s.marks || [];
  if (marks.includes('park')) for (const [x, y] of PARK) addItem(x, y, 'P', 'mk park');
  if (marks.includes('gates')) for (const [x, y] of GATES) addItem(x, y, ARROW, 'mk gate');
  if (marks.includes('stair')) addItem(STAIR[0], STAIR[1], STAIRS, 'mk stair');
  if (marks.includes('doors')) { addItem(DOOR_TK[0], DOOR_TK[1], DOORSVG, 'mk door'); addItem(DOOR[0], DOOR[1], DOORSVG, 'mk door main'); }
  for (const [x, y, t, k] of s.labels) addItem(x, y, t, 'lb ' + k);
  if (s.me != null) { const [x, y] = PATHS[mode].pts[s.me]; addItem(x, y, '나', 'mk me' + (mode === 'car' ? ' car' : '')); }
  if (s.pin) addItem(PIN[0], PIN[1], `<div class="name">주차관리과</div>${PINSVG('#1D3A8F')}`, 'pin');
  dot = addItem(0, 0, '', 'dot' + (mode === 'car' ? ' car' : ''));
  dot.style.display = 'none';
}
function render(animate) {
  const list = steps(), s = list[idx];
  document.body.classList.toggle('car-mode', mode === 'car');
  $('app').classList.toggle('car-mode', mode === 'car');
  $('mode-name').textContent = MODES[mode].name;
  $('cur').textContent = idx + 1; $('total').textContent = list.length;
  $('prog').innerHTML = list.map((_, i) => `<i class="${i <= idx ? 'on' : ''}"></i>`).join('');
  $('s-title').textContent = s.title;
  $('s-text').innerHTML = s.text;
  $('prev').disabled = idx === 0;
  $('map-prev').hidden = idx === 0;
  $('map-next').setAttribute('aria-label', idx === list.length - 1 ? '처음으로' : '다음 단계');
  $('chip-n').textContent = `${idx + 1}/${list.length}`;
  $('chip-t').textContent = s.title;
  $('next').querySelector('span').textContent = idx === list.length - 1 ? '처음으로' : '다음';
  $('list').innerHTML = list.map((t, i) => `<li class="${i === idx ? 'cur' : ''}"><button data-i="${i}"><span class="n">${i === 0 ? '전체' : i}</span><span><strong>${t.title}</strong><span class="t">${t.text.replace(/<[^>]+>/g, '')}</span></span></button></li>`).join('');
  const cur = drawRoutes(s);
  buildOverlay(s);
  setDotPath(cur);
  moveCamera(fitBox(s.box), animate);
}
// 카메라 — 단계가 바뀌면 지도를 그 구간으로 부드럽게 이동
function moveCamera(to, animate) {
  cancelAnimationFrame(anim);
  if (!animate || reduceMotion) { vb = to; place(); return; }
  const from = vb.slice(), t0 = performance.now(), dur = 750;
  const tick = now => {
    const p = Math.min(1, (now - t0) / dur), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    vb = from.map((v, i) => v + (to[i] - v) * e);
    place();
    if (p < 1) anim = requestAnimationFrame(tick);
  };
  anim = requestAnimationFrame(tick);
}
// 지금 구간 위를 천천히 움직이는 점 — 가는 방향을 보여줌
function setDotPath(pts) {
  const segs = []; let total = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); total += l; }
  dotSeg = { pts, segs, total, t0: performance.now() };
}
function dotLoop(now) {
  if (dot && dotSeg && dotSeg.total > 0) {
    const dur = 2600, t = reduceMotion ? 1 : ((now - dotSeg.t0) % (dur + 500)) / dur;
    if (t <= 1) {
      let d = Math.min(1, t) * dotSeg.total, i = 0;
      while (i < dotSeg.segs.length - 1 && d > dotSeg.segs[i]) { d -= dotSeg.segs[i]; i++; }
      const a = dotSeg.pts[i], b = dotSeg.pts[i + 1], f = dotSeg.segs[i] ? d / dotSeg.segs[i] : 0;
      const it = items.find(x => x.el === dot);
      it.x = a[0] + (b[0] - a[0]) * f; it.y = a[1] + (b[1] - a[1]) * f;
      const W = wrapEl.clientWidth, H = wrapEl.clientHeight;
      dot.style.left = (it.x - vb[0]) / vb[2] * W + 'px'; dot.style.top = (it.y - vb[1]) / vb[3] * H + 'px';
      dot.style.display = '';
    } else dot.style.display = 'none';
  }
  requestAnimationFrame(dotLoop);
}
requestAnimationFrame(dotLoop);

function go(i, fromAudio) {
  const n = steps().length;
  idx = (i + n) % n;
  render(true);
  // 지도가 화면 밖이면 지도 쪽으로
  const r = wrapEl.getBoundingClientRect();
  if (r.top < 0 || r.top > innerHeight * 0.5) wrapEl.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
  if (!fromAudio && playing) playCurrent();
}
$('prev').onclick = () => go(idx - 1);
$('next').onclick = () => go(idx === steps().length - 1 ? 0 : idx + 1);

// 지도 위에서 넘기기 — 양옆 버튼은 지도를 그대로 둔 채(스크롤 이동 없이) 넘김
function step(d) {
  if (d < 0 && idx === 0) return;
  hideHint();
  idx = d > 0 && idx === steps().length - 1 ? 0 : idx + d;
  render(true);
  if (playing) playCurrent();
}
$('map-prev').onclick = () => step(-1);
$('map-next').onclick = () => step(1);
// 옆으로 밀기 — 세로 스크롤은 그대로 두고, 가로로 충분히 밀었을 때만 넘김
let sw = null;
wrapEl.addEventListener('pointerdown', e => {
  if (e.target.closest('.nav')) return;
  sw = { x: e.clientX, y: e.clientY, t: performance.now() };
});
const endSwipe = e => {
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y, fast = performance.now() - sw.t < 600;
  sw = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && fast) step(dx < 0 ? 1 : -1);
};
wrapEl.addEventListener('pointerup', endSwipe);
wrapEl.addEventListener('pointercancel', () => { sw = null; });
// 처음 몇 초만 넘기는 방법 안내
const hint = $('swipe-hint');
function hideHint() { hint.classList.add('hide'); }
setTimeout(hideHint, 5000);
$('list').addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) go(+b.dataset.i); });
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowRight') go(idx + 1); else if (e.key === 'ArrowLeft' && idx > 0) go(idx - 1);
});
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  if (b.dataset.mode === mode) return;
  mode = b.dataset.mode; idx = 0;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-selected', x === b));
  stopAudio(); render(true);
});
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { vb = fitBox(steps()[idx].box); place(); }, 120); });

// ═════════ 음성 — 누르면 지금 단계부터 끝까지 이어서 읽고, 지도도 함께 넘어감 ═════════
const player = new Audio();
let playing = false;
function setPlayBtn() {
  const b = $('play');
  b.classList.toggle('on', playing);
  b.querySelector('use').setAttribute('href', playing ? '#i-stop' : '#i-sound');
  b.setAttribute('aria-label', playing ? '음성 멈추기' : '음성으로 듣기');
}
function playCurrent() {
  player.pause();
  player.src = AUDIO[steps()[idx].audio];
  player.play().catch(() => { toast('소리가 나지 않으면 휴대폰 소리를 켜 주세요'); stopAudio(); });
}
function stopAudio() { playing = false; player.pause(); setPlayBtn(); }
player.onended = () => {
  if (!playing) return;
  if (idx < steps().length - 1) { go(idx + 1, true); setTimeout(() => playing && playCurrent(), reduceMotion ? 0 : 700); }
  else stopAudio();
};
$('play').onclick = () => { if (playing) return stopAudio(); playing = true; setPlayBtn(); playCurrent(); };

// ═════════ 글씨 크기 ═════════
const SIZES = [18, 20, 22, 25, 28];
let sizeI = 1;
try { const v = localStorage.getItem('fontSizeIdx'); if (v !== null && +v >= 0 && +v < SIZES.length) sizeI = +v; } catch (_) {}
function applySize(save) {
  document.documentElement.style.fontSize = SIZES[sizeI] + 'px';
  if (save) try { localStorage.setItem('fontSizeIdx', sizeI); } catch (_) {}
  $('font-down').disabled = sizeI === 0;
  $('font-up').disabled = sizeI === SIZES.length - 1;
  vb = fitBox(steps()[idx].box); place();
}
$('font-up').onclick = () => { if (sizeI < SIZES.length - 1) { sizeI++; applySize(true); } };
$('font-down').onclick = () => { if (sizeI > 0) { sizeI--; applySize(true); } };

// ═════════ 네이버지도 — 휴대폰은 앱으로, 앱이 없으면 웹으로 ═════════
const NAVER_WEB = 'https://map.naver.com/p/search/' + encodeURIComponent('다산지금로16번길 95');
const NAVER_APP = `nmap://place?lat=${PLACE.lat}&lng=${PLACE.lng}&name=${encodeURIComponent(PLACE.name)}&appname=${encodeURIComponent(location.hostname || 'parking-guide')}`;
const way = $('way');
way.href = NAVER_WEB;
way.addEventListener('click', e => {
  if (!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) return;
  e.preventDefault();
  const t = setTimeout(() => { if (!document.hidden) location.href = NAVER_WEB; }, 1500);
  addEventListener('pagehide', () => clearTimeout(t), { once: true });
  location.href = NAVER_APP;
});
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2400); }

applySize(false);
render(false);
</script>
</body>
</html>
