<style>
  :root {
    --bg: #FDFBF7; --paper: #FFFFFF; --sand: #F5EFE4; --sand-2: #EDE4D3; --line: #E5DACA;
    --ink: #292524; --sub: #57504A; --mute: #7A7068;
    --terra: #C2785C; --terra-ink: #9A4A2E; --terra-soft: #F7E7DF;
    --sage: #4D5E3A; --sage-soft: #E9EDE1; --brown: #78350F;
    --shadow: 0 4px 6px -1px rgba(214, 200, 180, .45), 0 2px 4px -2px rgba(214, 200, 180, .45);
    --serif: "Noto Serif KR", "AppleMyungjo", "Nanum Myeongjo", "Batang", serif;
    font-size: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
    line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere;
    padding-bottom: calc(5.4rem + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 600px; margin: 0 auto; padding: 0 16px; }
  b, strong { font-weight: 800; }
  svg.i { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  button { font: inherit; color: inherit; }

  /* 위 */
  .top { display: flex; justify-content: space-between; align-items: center; padding: 14px 0 6px; }
  .org { font-size: .8rem; font-weight: 700; color: var(--sage); letter-spacing: .02em; }
  .size { display: flex; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); }
  .size span { font-size: .7rem; color: var(--mute); font-weight: 700; padding: 0 .4rem 0 .6rem; }
  .size button { width: 2.3rem; height: 2.3rem; border: 0; border-radius: 50%; background: transparent; font-weight: 800; cursor: pointer; }
  .size button:first-of-type { font-size: .8rem; }
  .size button:last-of-type { font-size: 1.1rem; }
  .size button:disabled { color: #C9BFB3; }

  .hero { padding: .6rem 0 0; }
  .hero h1 { margin: 0; font-family: var(--serif); font-weight: 900; font-size: 2rem; line-height: 1.3; color: var(--brown); letter-spacing: -.02em; }
  .hero h1 small { display: block; font-size: .62em; font-weight: 700; color: var(--ink); margin-top: .2rem; }

  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }

  /* 어디서 오세요? */
  .choose { margin: .4rem 0 1.4rem; scroll-margin-top: 14px; }
  .choose h2 { margin: 0 0 .7rem; font-family: var(--serif); font-size: 1.4rem; color: var(--brown); }
  .choices { display: grid; gap: .7rem; }
  .choice { display: flex; align-items: center; gap: .9rem; width: 100%; padding: 1rem 1.1rem; text-align: left; background: var(--paper); border: 2px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); cursor: pointer; }
  .choice .ic { flex: none; width: 2.8rem; height: 2.8rem; border-radius: 14px; display: grid; place-items: center; background: var(--sand); color: var(--sub); }
  .choice .ic svg.i { width: 1.5rem; height: 1.5rem; }
  .choice b { display: block; font-size: 1.15rem; line-height: 1.35; }
  .choice small { display: block; font-size: .9rem; color: var(--sub); font-weight: 600; }
  .choice[aria-pressed="true"] { border-color: var(--terra-ink); background: var(--terra-soft); }
  .choice[aria-pressed="true"] .ic { background: var(--terra-ink); color: #fff; }
  .choice.car[aria-pressed="true"] { border-color: var(--sage); background: var(--sage-soft); }
  .choice.car[aria-pressed="true"] .ic { background: var(--sage); }

  /* 단계 — 왼쪽 세로선으로 이어지는 순서 */
  .steps { position: relative; margin-top: 1rem; }
  .group[hidden] { display: none; }
  .step { position: relative; padding-left: 2.9rem; padding-bottom: 1.6rem; scroll-margin-top: 14px; }
  .step::before { content: ""; position: absolute; left: 1.05rem; top: 2.4rem; bottom: 0; width: 2px; background: repeating-linear-gradient(to bottom, var(--sand-2) 0 6px, transparent 6px 12px); }
  .step.last::before, .step.overview::before { display: none; }
  .step.overview { padding-left: 0; }
  .num { position: absolute; left: 0; top: 0; width: 2.2rem; height: 2.2rem; border-radius: 50%; display: grid; place-items: center; background: var(--paper); border: 2px solid var(--terra); color: var(--terra-ink); font-weight: 900; font-size: 1rem; }
  .car .num { border-color: var(--sage); color: var(--sage); }
  .step.last .num { background: var(--terra-ink); border-color: var(--terra-ink); color: #fff; font-size: .7rem; }
  .car .step.last .num { background: var(--sage); border-color: var(--sage); }
  .kicker { font-size: .8rem; font-weight: 800; color: var(--terra-ink); letter-spacing: .04em; line-height: 2.2rem; }
  .car .kicker, .step.overview .kicker { color: var(--sage); }
  .step h2 { margin: .1rem 0 .7rem; font-family: var(--serif); font-weight: 700; font-size: 1.4rem; line-height: 1.35; color: var(--ink); }
  .step.overview h2 { font-size: 1.5rem; color: var(--brown); }
  .scard { overflow: hidden; transition: box-shadow .3s, border-color .3s; }
  .step.reading .scard { border-color: var(--sage); box-shadow: 0 0 0 3px var(--sage-soft), var(--shadow); }
  .map { display: block; width: 100%; height: auto; background: #F1EBDF; border-bottom: 1px solid var(--line); }
  .legend { display: flex; flex-wrap: wrap; gap: .3rem 1rem; padding: .7rem 1.1rem 0; font-size: .85rem; font-weight: 700; color: var(--sub); }
  .legend i { display: inline-block; width: 1.4rem; height: .3rem; border-radius: 3px; margin-right: .35rem; vertical-align: middle; }
  .sbody { padding: 1rem 1.1rem 1.1rem; }
  .say { margin: 0; font-size: 1.15rem; font-weight: 700; line-height: 1.55; }
  .say em { font-style: normal; color: var(--terra-ink); font-weight: 900; }
  .car .say em { color: var(--sage); }
  .tip { margin: .5rem 0 0; font-size: .95rem; color: var(--sub); }
  .listen { margin-top: .9rem; display: inline-flex; align-items: center; gap: .45rem; min-height: 2.8rem; padding: 0 1rem; border-radius: 12px; border: 1px solid #C9D2BC; background: var(--sage-soft); color: var(--sage); font-size: .95rem; font-weight: 800; cursor: pointer; }
  .listen.on { background: var(--brown); border-color: var(--brown); color: #fff; }

  .help { margin: .4rem 0 1.2rem; padding: 1.3rem 1.1rem; text-align: center; background: var(--sand); border: 0; box-shadow: none; }
  .help h3 { margin: 0 0 .2rem; font-family: var(--serif); font-size: 1.2rem; color: var(--brown); }
  .help p { margin: 0 0 .7rem; color: var(--sub); font-size: .95rem; }
  .help a { display: inline-flex; align-items: center; gap: .5rem; font-size: 1.6rem; font-weight: 900; color: var(--ink); text-decoration: none; letter-spacing: .02em; }
  footer { padding: .2rem 0 1.4rem; text-align: center; font-size: .75rem; color: var(--mute); }

  /* 아래 고정 버튼 */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: rgba(253, 251, 247, .96); border-top: 1px solid var(--line); backdrop-filter: blur(8px); }
  .dock a { display: flex; align-items: center; justify-content: center; gap: .5rem; min-height: 3.5rem; border-radius: 16px; font-size: 1.1rem; font-weight: 800; text-decoration: none; }
  .dock .call { background: var(--sage); color: #fff; box-shadow: var(--shadow); }
  .dock .way { background: var(--paper); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); }
  @media (min-width: 640px) { .dock { left: 50%; right: auto; width: 600px; transform: translateX(-50%); border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; } }

  .toast { position: fixed; left: 50%; bottom: calc(6rem + env(safe-area-inset-bottom)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); background: var(--ink); color: #fff; padding: .7rem 1.1rem; border-radius: 14px; font-size: .95rem; font-weight: 700; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }
</style>
</head>

  // ── 차를 타고 주차장으로 ──
  {

    labels: [[606, 612, '출입구', 'sage'], [440, 530, '주차장', 'plain']],

  },
  {
    group: 'car', num: '2', kicker: '2단계', title: '주차장에 세우세요', audio: 6,
    box: [110, 240, 520, 420], routes: [['car', 0, 3]], gates: true,

    say: '넓은 주차장에 편하게 세우세요.<br>세우신 뒤 <em>오른쪽 위 작은 건물</em> 쪽으로 걸어오세요.',

  },
  {
    group: 'car', num: '도착', kicker: '도착', cls: 'last', title: '계단 올라 왼쪽이 주차관리과', audio: 7,
    box: [470, 320, 275, 300], routes: [['car', 2, 6]], pin: true, doors: true, stair: true,
    labels: [[528, 468, '공원조성과', 'dim'], [650, 562, '교통약자이동지원센터', 'dim'], [505, 552, '계단', 'sage']],
    say: '<em>공원조성과</em>와 <em>교통약자이동지원센터</em> 사이 계단으로 올라와, <em>왼쪽으로 조금</em> 가시면 <em>주차관리과</em> 입구예요.',

// ═════════ 안내도 그리기 (위에서 내려다본 입체) ═════════
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const P = pts => pts.map(p => p.join(',')).join(' ');
const COLORS = {
  etc:  { roof: '#FBF8F2', wall: '#D9CFC0' },
  two:  { roof: '#EFE9DE', wall: '#A99C89' },
  two2: { roof: '#F6F2EA', wall: '#C8BDAD' },
  tk:   { roof: '#D3DCC4', wall: '#6E8255' },
  dest: { roof: '#EDBFA9', wall: '#C2785C' }
};
const PILL = { sage: ['#4D5E3A', '#fff', '#fff'], plain: ['#FFFFFF', '#292524', '#D9CFC0'], dim: ['#F1EBDF', '#57504A', '#D9CFC0'], no: ['#78350F', '#fff', '#fff'] };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), f = c => Math.max(0, Math.min(255, Math.round(c * k)));
  return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`;
}
// 글자 폭 대략 계산(한글은 글자 크기만큼, 영문·숫자·기호는 절반 남짓)
const textW = (t, size) => [...t].reduce((w, ch) => w + (/[가-힣]/.test(ch) ? 1 : 0.6), 0) * size;
// 이름표 — 화면 기준 크기로 그린 뒤 k배
function tag(parent, x, y, k, t, fs, [bg, fg, stroke]) {
  const w = textW(t, fs) + fs * 1.2, h = fs * 1.75;
  const g = el('g', { transform: `translate(${x} ${y}) scale(${k})` }, parent);
  el('rect', { x: -w / 2 + 1, y: -h / 2 + 2.5, width: w, height: h, rx: 12, fill: 'rgba(120, 90, 50, .18)' }, g);
  el('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 12, fill: bg, stroke, 'stroke-width': 1.5 }, g);
  el('text', { y: fs * 0.36, 'text-anchor': 'middle', 'font-size': fs, 'font-weight': 800, fill: fg }, g).textContent = t;
  return g;
}
// 화면에서 일정한 크기로 보이는 작은 표시
const mark = (parent, [x, y], k) => el('g', { transform: `translate(${x} ${y}) scale(${k})` }, parent);

function drawMap(svg, s, idx) {
  svg.innerHTML = '';
  const [bx, by, bw, bh] = s.box;
  svg.setAttribute('viewBox', `${bx} ${by} ${bw} ${bh}`);
  svg.style.aspectRatio = `${bw} / ${bh}`;
  const k = bw / (svg.clientWidth || Math.min(innerWidth, 600) - 80);   // 화면 1px = 지도 몇 단위
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
  const g = el('g', {}, svg);
  const defs = el('defs', {}, svg);
  defs.innerHTML = `
    <pattern id="lot${idx}" width="${16 * k}" height="${16 * k}" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)"><rect width="${16 * k}" height="${16 * k}" fill="#E6DECF"/><path d="M0 0V${16 * k}" stroke="#DAD0BF" stroke-width="${1.5 * k}"/></pattern>` +
    Object.entries(PATHS).map(([n, p]) => `<marker id="ah${idx}${n}" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="${p.color}"/></marker>`).join('');

  // 바탕·녹지·도로
  el('rect', { x: -800, y: -1400, width: 2400, height: 2600, fill: '#F1EBDF' }, g);
  el('path', { d: 'M790 -1000 C800 200 830 420 920 760 L1500 760 L1500 -1000 Z', fill: '#DCE0CC' }, g);
  for (const r of ROADS) {
    el('polyline', { points: P(r.pts), stroke: '#E2D7C5', 'stroke-width': r.w + 6, fill: 'none', 'stroke-linejoin': 'round' }, g);
    el('polyline', { points: P(r.pts), stroke: '#FFFDF8', 'stroke-width': r.w, fill: 'none', 'stroke-linejoin': 'round' }, g);
  }
  // 36번길 횡단보도 — 도로를 가로지르는 줄무늬
  {
    const ux = 0.98, uy = -0.2, vx = 0.2, vy = 0.98;   // 도로 방향 / 건너는 방향
    for (let i = -3; i <= 3; i++) {
      const cx = CROSS[0] + i * 4.5 * ux, cy = CROSS[1] + i * 4.5 * uy;
      el('line', { x1: cx - 15 * vx, y1: cy - 15 * vy, x2: cx + 15 * vx, y2: cy + 15 * vy, stroke: '#CDBFAA', 'stroke-width': 2.6 }, g);
    }
  }
  // 부지·주차장
  for (const site of [SITE2, SITE]) el('polygon', { points: P(site), fill: '#F8F4EC', stroke: '#E9DCCB', 'stroke-width': 8, 'stroke-linejoin': 'round' }, g);
  for (const lot of LOTS) el('polygon', { points: P(lot), fill: `url(#lot${idx})`, stroke: '#E9DCCB', 'stroke-width': 10, 'stroke-linejoin': 'round' }, g);
  // 도로 이름 — 도로 폭 안에 들어갈 만큼 확대된 그림에서만
  for (const r of ROADS) {
    const fs = 0.72 * rem * k;
    if (!r.name || fs > r.w * 0.8) continue;
    el('text', { x: r.at[0], y: r.at[1] + fs * 0.35, 'text-anchor': 'middle', 'font-size': fs, 'font-weight': 700, fill: '#7A7068', transform: `rotate(${r.rot} ${r.at[0]} ${r.at[1]})` }, g).textContent = r.name;
  }
  // 주차장 P
  for (const p of PARK) {
    const m = mark(g, p, k);
    el('rect', { x: -11, y: -11, width: 22, height: 22, rx: 6, fill: '#57504A', stroke: '#FFFDF8', 'stroke-width': 2 }, m);
    el('text', { y: 6, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 900, fill: '#fff' }, m).textContent = 'P';
  }

  // 건물 (남쪽 것을 나중에 그려 앞에 보이게, 위로 솟은 입체)
  const order = BLDS.slice().sort((a, b) => Math.max(...a.pts.map(p => p[1])) - Math.max(...b.pts.map(p => p[1])));
  for (const b of order) {
    const c = COLORS[b.kind], ox = b.h * 0.42, oy = -b.h;
    el('polygon', { points: P(b.pts.map(([x, y]) => [x + b.h * 0.6, y + b.h * 0.3])), fill: 'rgba(120, 90, 50, .12)' }, g);
    const walls = b.pts.map((p, i) => [p, b.pts[(i + 1) % b.pts.length]]).sort((a, d) => (a[0][1] + a[1][1]) - (d[0][1] + d[1][1]));
    for (const [a, d] of walls) {
      const nx = d[1] - a[1], ny = -(d[0] - a[0]), L = Math.hypot(nx, ny);
      const sh = 0.8 + 0.2 * ((nx * -0.35 + ny * 0.94) / L);   // 남쪽을 향한 벽은 밝게
      el('polygon', { points: P([a, d, [d[0] + ox, d[1] + oy], [a[0] + ox, a[1] + oy]]), fill: shade(c.wall, sh), stroke: shade(c.wall, 0.8), 'stroke-width': 0.8 }, g);
    }
    el('polygon', { points: P(b.pts.map(([x, y]) => [x + ox, y + oy])), fill: c.roof, stroke: shade(c.wall, 0.8), 'stroke-width': b.kind === 'dest' ? 2 : 1 }, g);
  }

  // 경로 — 건물보다 나중에 그려 가려지지 않게. 고른 구간은 흐르는 점선 + 화살촉
  for (const [name, a, b] of s.routes) {
    const p = PATHS[name];
    el('polyline', { points: P(p.pts), fill: 'none', stroke: '#FFFDF8', 'stroke-width': 15 * k, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    el('polyline', { points: P(p.pts), fill: 'none', stroke: p.faint, 'stroke-width': 5 * k, 'stroke-linecap': 'round', 'stroke-dasharray': `${2 * k} ${11 * k}`, opacity: .5 }, g);
    const on = el('polyline', { points: P(p.pts.slice(a, b + 1)), fill: 'none', stroke: p.color, 'stroke-width': 7 * k, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'stroke-dasharray': `${14 * k} ${12 * k}`, 'marker-end': `url(#ah${idx}${name})` }, g);
    if (!reduceMotion) el('animate', { attributeName: 'stroke-dashoffset', from: 0, to: -26 * k, dur: '1.6s', repeatCount: 'indefinite' }, on);
  }

  // 계단 (주차장 → 통로)
  if (s.stair) {
    const m = mark(g, [STAIR[0] - 14, STAIR[1] + 4], k);   // 경로 바로 옆
    el('rect', { x: -10, y: -10, width: 20, height: 20, rx: 5, fill: '#FFFDF8', stroke: '#4D5E3A', 'stroke-width': 2 }, m);
    el('path', { d: 'M-6 6 H-2 V2 H2 V-2 H6 V-6', stroke: '#4D5E3A', 'stroke-width': 2.2, fill: 'none', 'stroke-linejoin': 'round' }, m);
  }

  // 교통국 입구 — 첫 번째(교통정책과·대중교통과)는 작게, 두 번째(주차관리과)는 강조
  if (s.doors) {
    const d1 = mark(g, DOOR_TK, k);
    el('rect', { x: -6, y: -9, width: 12, height: 18, rx: 3, fill: '#6E8255', stroke: '#FFFDF8', 'stroke-width': 2 }, d1);
    const d2 = mark(g, DOOR, k);
    el('rect', { x: -8, y: -12, width: 16, height: 24, rx: 3, fill: '#9A4A2E', stroke: '#FFFDF8', 'stroke-width': 2.5 }, d2);
    el('circle', { cx: 4, cy: 1, r: 1.8, fill: '#FFFDF8' }, d2);
  }

  // 주차장 출입구
  if (s.gates) for (const gp of GATES) {
    const m = mark(g, gp, k);
    el('circle', { r: 13, fill: '#4D5E3A', stroke: '#FFFDF8', 'stroke-width': 3.5 }, m);
    el('path', { d: 'M0 6 V-6 M-5 -1 L0 -6 L5 -1', stroke: '#fff', 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, m);
  }

  // 「나」 — 출발하는 곳
  if (s.me) {
    const m = mark(g, PATHS[s.me[0]].pts[s.me[1]], k);
    el('circle', { r: 22, fill: '#78350F', opacity: .15 }, m);
    el('circle', { r: 14, fill: '#78350F', stroke: '#FFFDF8', 'stroke-width': 4 }, m);
    el('text', { y: 5.5, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 900, fill: '#fff' }, m).textContent = '나';
  }

  // 이름표 — 화면에서 늘 같은 크기
  for (const [x, y, t, kind] of s.labels) tag(g, x, y, k, t, (kind === 'dim' ? 0.78 : 0.95) * rem, PILL[kind]);

  // 목적지 핀 + 「주차관리과」 — 건물 지붕 위(경로를 가리지 않게)
  if (s.pin) {
    const pin = el('g', { transform: `translate(${PIN[0]} ${PIN[1] - 18}) scale(${k})` }, g);
    el('ellipse', { cx: 0, cy: 2, rx: 10, ry: 4, fill: 'rgba(120, 90, 50, .25)' }, pin);
    el('path', { d: 'M0 0 C-5 -12 -19 -22 -19 -38 A19 19 0 1 1 19 -38 C19 -22 5 -12 0 0 Z', fill: '#9A4A2E', stroke: '#FFFDF8', 'stroke-width': 3.5 }, pin);
    el('circle', { cx: 0, cy: -38, r: 7, fill: '#FFFDF8' }, pin);
    tag(pin, 0, -68 - rem * 0.9, 1, '주차관리과', 1.0 * rem, ['#292524', '#fff', '#fff']);
  }
}

// ═════════ 단계 카드 ═════════
const maps = [];
const LISTEN = '<svg class="i"><use href="#i-sound"/></svg>이 단계 듣기', STOP = '<svg class="i"><use href="#i-stop"/></svg>그만 듣기';
STEPS.forEach((s, i) => {
  const sec = document.createElement('section');
  sec.className = 'step ' + (s.cls || ''); sec.id = 'step' + i;
  sec.innerHTML = `
    ${s.num ? `<div class="num">${s.num}</div>` : ''}
    <div class="kicker">${s.kicker}</div>
    <h2>${s.title}</h2>
    <div class="card scard">
      <svg class="map" role="img" aria-label="${s.title} 안내 그림"></svg>
      ${s.legend ? '<div class="legend"><span><i style="background:#9A4A2E"></i>제2청사에서 걸어서</span><span><i style="background:#4D5E3A"></i>차로 주차장에서</span></div>' : ''}
      <div class="sbody">
        <p class="say">${s.say}</p>
        <p class="tip">${s.tip}</p>
        <button class="listen" data-i="${i}">${LISTEN}</button>
      </div>
    </div>`;
  document.getElementById('g-' + s.group).appendChild(sec);
  maps.push(sec.querySelector('svg'));
});
// 숨겨진 묶음은 너비가 0이라 보일 때 다시 그림
const redraw = () => STEPS.forEach((s, i) => { if (maps[i].clientWidth || s.group === 'all') drawMap(maps[i], s, i); });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(redraw, 150); });

// ═════════ 어디서 오세요? ═════════
document.querySelectorAll('.choice').forEach(btn => btn.onclick = () => {
  const g = btn.dataset.g;
  document.querySelectorAll('.choice').forEach(b => b.setAttribute('aria-pressed', b === btn));
  document.getElementById('g-walk').hidden = g !== 'walk';
  document.getElementById('g-car').hidden = g !== 'car';
  stopAudio(); redraw();
  document.getElementById('g-' + g).firstElementChild.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
});

// ═════════ 글씨 크기 ═════════
const SIZES = [18, 20, 23, 26, 30];
let sizeI = 1;
try { const v = localStorage.getItem('fontSizeIdx'); if (v !== null && +v >= 0 && +v < SIZES.length) sizeI = +v; } catch (_) {}
function applySize(save) {
  document.documentElement.style.fontSize = SIZES[sizeI] + 'px';
  if (save) try { localStorage.setItem('fontSizeIdx', sizeI); } catch (_) {}
  document.getElementById('font-down').disabled = sizeI === 0;
  document.getElementById('font-up').disabled = sizeI === SIZES.length - 1;
  redraw();
}
document.getElementById('font-up').onclick = () => { if (sizeI < SIZES.length - 1) { sizeI++; applySize(true); } };
document.getElementById('font-down').onclick = () => { if (sizeI > 0) { sizeI--; applySize(true); } };

// ═════════ 음성 안내 ═════════
const player = new Audio();
let playing = -1;
function resetButtons() {
  document.querySelectorAll('.listen').forEach(b => { b.classList.remove('on'); b.innerHTML = LISTEN; });
  document.querySelectorAll('.step').forEach(s => s.classList.remove('reading'));
}
function stopAudio() { player.pause(); playing = -1; resetButtons(); }
function playStep(i) {
  resetButtons();
  const sec = document.getElementById('step' + i), btn = sec.querySelector('.listen');
  sec.classList.add('reading'); btn.classList.add('on'); btn.innerHTML = STOP;
  playing = i;
  player.src = AUDIO[STEPS[i].audio];
  player.play().catch(() => { toast('소리가 안 나면 휴대폰 소리를 켜 주세요'); stopAudio(); });
}
player.onended = stopAudio;
document.querySelector('main').addEventListener('click', e => {
  const b = e.target.closest('.listen'); if (!b) return;
  const i = +b.dataset.i;
  if (playing === i) stopAudio(); else playStep(i);
});
applySize(false);

// ═════════ 길찾기 ═════════
const NAVER_WEB = 'https://map.naver.com/p/search/' + encodeURIComponent('다산지금로16번길 95');
const NAVER_APP = `nmap://place?lat=${PLACE.lat}&lng=${PLACE.lng}&name=${encodeURIComponent(PLACE.name)}&appname=${encodeURIComponent(location.hostname || 'parking-guide')}`;
const way = document.getElementById('way');
way.href = NAVER_WEB;
way.addEventListener('click', e => {
  if (!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) return;   // PC는 웹 지도로
  e.preventDefault();
  const t = setTimeout(() => { if (!document.hidden) location.href = NAVER_WEB; }, 1500);   // 앱이 없으면 웹으로
  addEventListener('pagehide', () => clearTimeout(t), { once: true });
  location.href = NAVER_APP;
});
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2400); }
</script>
